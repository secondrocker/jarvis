openai:
  api_key: 替换为你的-api-key
  model: gpt-5.6-sol
  base_url: ""
  summary_model: null
  solution_planning_model: null
  info_price_model: null
  timeout_seconds: 60
  max_retries: 2
task:
  timeout_seconds: 600
log:
  level: INFO
s3:
  endpoint_url: https://s3.leegoo.ltd
  region: us-east-1
  bucket: secrets
  access_key: 替换为你的-access-key
  secret_key: 替换为你的-secret-key
  url_expires_seconds: 604800
mcp:
  enabled: true
  mount_path: /mcp
  token: 替换为你的-mcp-token（openssl rand -hex 32 生成，留空则不启用认证）
web_gateway:
  base_url: https://surf.leegoo.ltd
  api_token: 替换为你的-token
  search_timeout_seconds: 15
  fetch_timeout_seconds: 40
  total_call_limit: 8
# Gemini 图像生成(gemini-web2api 反代);未配置则不注册 generate_image 工具
image_gen:
  base_url: https://gemini.leegoo.ltd
  api_key: sk-gemini-替换为你的-key
  model: gemini-image
  timeout_seconds: 180

# 作业批改(小程序)
grade_homework:
  max_image_mb: 8
  max_image_edge: 2048
auth:
  access_password: homework-2024   # 留空/删除此段 = 开放访问
  secret: change-me-64-hex
  token_ttl_hours: 168
