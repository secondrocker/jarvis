# 应用配置模板：复制为 config.yaml（不入库）并按需修改。
# 敏感凭证（OPENAI_API_KEY / S3_ACCESS_KEY / S3_SECRET_KEY）通过环境变量注入，不要写在此处。
openai:
  model: gpt-5.6-sol
  base_url: ""
  timeout_seconds: 60
  max_retries: 2
task:
  timeout_seconds: 300
log:
  level: INFO
s3:
  endpoint_url: https://s3.leegoo.ltd
  region: us-east-1
  bucket: secrets
  url_expires_seconds: 604800
mcp:
  enabled: true
  mount_path: /mcp
