openai:
  api_key: 替换为你的-api-key
  model: gpt-5.6-sol
  base_url: ""
  summary_model: null
  solution_planning_model: null
  info_price_model: null
  timeout_seconds: 60
  max_retries: 2
task:
  timeout_seconds: 600
log:
  level: INFO
s3:
  endpoint_url: https://s3.leegoo.ltd
  region: us-east-1
  bucket: secrets
  access_key: 替换为你的-access-key
  secret_key: 替换为你的-secret-key
  url_expires_seconds: 604800
mcp:
  enabled: true
  mount_path: /mcp
  token: 替换为你的-mcp-token（openssl rand -hex 32 生成，留空则不启用认证）
# Gemini 图像生成(gemini-web2api 反代);未配置则不注册 generate_image 工具
image_gen:
  base_url: https://gemini.leegoo.ltd
  api_key: sk-gemini-替换为你的-key
  model: gemini-image
  # gpt-6-luna 生图在 image_vision 网关 /v1/images/generations 请求的模型名
  # (上游 codex-proxy 固定改写为 gpt-image-2)
  luna_image_model: gpt-image-2
  # gemini 生图失败时是否自动降级到 gpt-6-luna(需 image_vision 已配置)
  luna_fallback: true
  timeout_seconds: 180

# Gemini 图像内容识别(vision, OpenAI 兼容反代);未配置则不注册 recognize_image / organize_images 工具
image_vision:
  base_url: https://gemini.leegoo.ltd
  api_key: sk-gemini-替换为你的-key
  model: gemini-3.8-flash
  fallback_model: gemini-3.6-flash
  timeout_seconds: 120
  max_image_edge: 1280
  batch_limit: 20

# 作业批改(小程序)
grade_homework:
  max_image_mb: 8
  max_image_edge: 2048
auth:
  access_password: homework-2024   # 留空/删除此段 = 开放访问
  secret: change-me-64-hex
  token_ttl_hours: 168
